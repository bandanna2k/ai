plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("io.modelcontextprotocol.sdk:mcp:1.1.2")
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'io.vertx:vertx-core:5.0.11'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.16'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
}

application {
    mainClass = 'dnt.mcpservice.Main'
}

shadowJar {
    archiveFileName = 'mcp-service-all.jar'
}

test {
    useJUnitPlatform()
}

